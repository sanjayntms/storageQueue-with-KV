name: Deploy Full StorageQueue + KV + VM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RG_NAME: ntms-kv-vm-rg
      LOCATION: centralindia
      KV_NAME: ntmsrhkv2
      VM_NAME: ntmsqueuevm
      ADMIN_USER: vmadmin
      STORAGE_NAME: ntmsstor${{ github.run_id }}
      QUEUE_NAME: image-processing-queue
      UPLOADED_CONTAINER: uploaded-images
      PROCESSED_CONTAINER: processed-images
      SECRET_NAME: AZURE-STORAGE-CONNECTION-STRING
      ADMIN_PASS: ${{ secrets.VM_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create resource group
        run: |
          az group create --name "$RG_NAME" --location "$LOCATION"

      - name: Create Key Vault (Idempotent)
        run: |
          if az keyvault show --name "$KV_NAME" --resource-group "$RG_NAME" >/dev/null 2>&1; then
            echo "Key Vault $KV_NAME already exists. Skipping creation."
          else
            echo "Creating Key Vault $KV_NAME..."
            az keyvault create \
              --name "$KV_NAME" \
              --resource-group "$RG_NAME" \
              --location "$LOCATION" \
              --enable-rbac-authorization false
          fi


      - name: Create Storage Account
        run: |
          az storage account create \
            --name "$STORAGE_NAME" \
            --resource-group "$RG_NAME" \
            --location "$LOCATION" \
            --sku Standard_LRS \
            --kind StorageV2

      - name: Save storage connection string to Key Vault
        run: |
          conn=$(az storage account show-connection-string --resource-group "$RG_NAME" --name "$STORAGE_NAME" -o tsv)
          az keyvault secret set --vault-name "$KV_NAME" --name "$SECRET_NAME" --value "$conn"

      - name: Create queue and blob containers
        run: |
          az storage queue create --name "$QUEUE_NAME" --account-name "$STORAGE_NAME"
          az storage container create --name "$UPLOADED_CONTAINER" --account-name "$STORAGE_NAME"
          az storage container create --name "$PROCESSED_CONTAINER" --account-name "$STORAGE_NAME"

      - name: Create VNet and subnet
        run: |
          az network vnet create \
            --resource-group "$RG_NAME" \
            --name ntms-vnet \
            --address-prefix 10.1.0.0/16 \
            --subnet-name default \
            --subnet-prefix 10.1.1.0/24

      # ----------------------------
      # CREATE NSG + RULE FOR PORT 3000
      # ----------------------------

      - name: Create NSG
        run: |
          az network nsg create \
            --resource-group "$RG_NAME" \
            --name "${VM_NAME}-nsg"

      - name: Create NSG rule for port 3000
        run: |
          az network nsg rule create \
            --resource-group "$RG_NAME" \
            --nsg-name "${VM_NAME}-nsg" \
            --name allow-3000 \
            --protocol Tcp \
            --priority 300 \
            --destination-port-ranges 3000 \
            --access Allow \
            --direction Inbound

      # ----------------------------
      # PUBLIC IP + NIC WITH NSG
      # ----------------------------

      - name: Create public IP
        run: |
          az network public-ip create \
            --resource-group "$RG_NAME" \
            --name "${VM_NAME}-ip" \
            --allocation-method Static

      - name: Create NIC (attach NSG)
        run: |
          az network nic create \
            --resource-group "$RG_NAME" \
            --name "${VM_NAME}-nic" \
            --vnet-name ntms-vnet \
            --subnet default \
            --network-security-group "${VM_NAME}-nsg" \
            --public-ip-address "${VM_NAME}-ip"

      # ----------------------------
      # VM CREATION
      # ----------------------------

      - name: Create VM (password-based)
        run: |
          az vm create \
            --resource-group "$RG_NAME" \
            --name "$VM_NAME" \
            --image Ubuntu2204 \
            --admin-username "$ADMIN_USER" \
            --admin-password "$ADMIN_PASS" \
            --nics "${VM_NAME}-nic" \
            --size Standard_B1s

      - name: Get VM public IP
        id: getvmip
        run: |
          ip=$(az vm list-ip-addresses --resource-group "$RG_NAME" --name "$VM_NAME" --query "[0].virtualMachine.network.publicIpAddresses[0].ipAddress" -o tsv)
          echo "vm_ip=$ip" >> "$GITHUB_OUTPUT"

      # ----------------------------
      # ENABLE MI + KV ACCESS
      # ----------------------------

      - name: Enable managed identity
        run: |
          az vm identity assign --resource-group "$RG_NAME" --name "$VM_NAME"

      - name: Grant Key Vault GET to VM managed identity
        run: |
          principal_id=$(az vm show --resource-group "$RG_NAME" --name "$VM_NAME" --query identity.principalId -o tsv)
          az keyvault set-policy --name "$KV_NAME" --object-id "$principal_id" --secret-permissions get

      # ----------------------------
      # DEPLOY APP TO VM
      # ----------------------------

      - name: Copy repo to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.getvmip.outputs.vm_ip }}
          username: ${{ env.ADMIN_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          source: "."
          target: "/opt/ntms-kv-blob-queue"

      - name: Run setup script on VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ steps.getvmip.outputs.vm_ip }}
          username: ${{ env.ADMIN_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd /opt/ntms-kv-blob-queue
            chmod +x setup_storagequeue.sh
            export KEY_VAULT_URI="https://$KV_NAME.vault.azure.net/"
            ./setup_storagequeue.sh

