name: Deploy StorageQueue + KV + VM (Idempotent)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RG_NAME: ntms-kv-vm-rg
      LOCATION: centralindia
      KV_NAME: ntmsrhkv2
      VM_NAME: ntmsqueuevm
      ADMIN_USER: vmadmin
      ADMIN_PASS: ${{ secrets.VM_PASSWORD }}

      STORAGE_NAME: ntmsstorntms999
      QUEUE_NAME: image-processing-queue
      UPLOADED_CONTAINER: uploaded-images
      PROCESSED_CONTAINER: processed-images
      SECRET_NAME: AZURE-STORAGE-CONNECTION-STRING

    steps:

      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      ############################################################
      # RESOURCE GROUP
      ############################################################
      - name: Create RG
        run: |
          az group create --name "$RG_NAME" --location "$LOCATION"

      ############################################################
      # KEY VAULT
      ############################################################
      - name: Create Key Vault (Idempotent)
        run: |
          if az keyvault show --name "$KV_NAME" >/dev/null 2>&1; then
            echo "Key Vault exists."
          else
            az keyvault create \
              --name "$KV_NAME" \
              --resource-group "$RG_NAME" \
              --location "$LOCATION" \
              --enable-rbac-authorization false
          fi

      ############################################################
      # STORAGE
      ############################################################
      - name: Create Storage Account (Idempotent)
        run: |
          if az storage account show --name "$STORAGE_NAME" >/dev/null 2>&1; then
            echo "Storage exists."
          else
            az storage account create \
              --name "$STORAGE_NAME" \
              --resource-group "$RG_NAME" \
              --location "$LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2
          fi

      - name: Save Storage Connection String to Key Vault
        run: |
          conn=$(az storage account show-connection-string --resource-group "$RG_NAME" --name "$STORAGE_NAME" -o tsv)
          az keyvault secret set \
            --vault-name "$KV_NAME" \
            --name "$SECRET_NAME" \
            --value "$conn"

      - name: Create Queue + Containers
        run: |
          az storage queue create --name "$QUEUE_NAME" --account-name "$STORAGE_NAME"
          az storage container create --name "$UPLOADED_CONTAINER" --account-name "$STORAGE_NAME"
          az storage container create --name "$PROCESSED_CONTAINER" --account-name "$STORAGE_NAME"

      ############################################################
      # NETWORKING
      ############################################################
      - name: Create VNet
        run: |
          if az network vnet show --resource-group "$RG_NAME" --name ntms-vnet >/dev/null 2>&1; then
            echo "VNet exists."
          else
            az network vnet create \
              --resource-group "$RG_NAME" \
              --name ntms-vnet \
              --address-prefix 10.1.0.0/16 \
              --subnet-name default \
              --subnet-prefix 10.1.1.0/24
          fi

      - name: Create NSG
        run: |
          if az network nsg show --resource-group "$RG_NAME" --name "${VM_NAME}-nsg" >/dev/null 2>&1; then
            echo "NSG exists."
          else
            az network nsg create \
              --resource-group "$RG_NAME" \
              --name "${VM_NAME}-nsg"
          fi

      - name: Allow SSH port 22
        run: |
          if az network nsg rule show --resource-group "$RG_NAME" --nsg-name "${VM_NAME}-nsg" --name allow-22 >/dev/null 2>&1; then
            echo "SSH rule exists."
          else
            az network nsg rule create \
              --resource-group "$RG_NAME" \
              --nsg-name "${VM_NAME}-nsg" \
              --name allow-22 \
              --protocol Tcp \
              --priority 200 \
              --destination-port-ranges 22 \
              --access Allow \
              --direction Inbound
          fi

      - name: Allow App port 3000
        run: |
          if az network nsg rule show --resource-group "$RG_NAME" --nsg-name "${VM_NAME}-nsg" --name allow-3000 >/dev/null 2>&1; then
            echo "Port 3000 rule exists."
          else
            az network nsg rule create \
              --resource-group "$RG_NAME" \
              --nsg-name "${VM_NAME}-nsg" \
              --name allow-3000 \
              --protocol Tcp \
              --priority 300 \
              --destination-port-ranges 3000 \
              --access Allow \
              --direction Inbound
          fi

      - name: Create Public IP
        run: |
          if az network public-ip show --resource-group "$RG_NAME" --name "${VM_NAME}-ip" >/dev/null 2>&1; then
            echo "Public IP exists."
          else
            az network public-ip create \
              --resource-group "$RG_NAME" \
              --name "${VM_NAME}-ip" \
              --allocation-method Static
          fi

      - name: Create NIC
        run: |
          if az network nic show --resource-group "$RG_NAME" --name "${VM_NAME}-nic" >/dev/null 2>&1; then
            echo "NIC exists."
          else
            az network nic create \
              --resource-group "$RG_NAME" \
              --name "${VM_NAME}-nic" \
              --vnet-name ntms-vnet \
              --subnet default \
              --network-security-group "${VM_NAME}-nsg" \
              --public-ip-address "${VM_NAME}-ip"
          fi

      ############################################################
      # VM
      ############################################################
      - name: Create VM (Idempotent)
        run: |
          if az vm show --resource-group "$RG_NAME" --name "$VM_NAME" >/dev/null 2>&1; then
            echo "VM exists."
          else
            az vm create \
              --resource-group "$RG_NAME" \
              --name "$VM_NAME" \
              --image Ubuntu2204 \
              --admin-username "$ADMIN_USER" \
              --admin-password "$ADMIN_PASS" \
              --nics "${VM_NAME}-nic" \
              --size Standard_B1s
          fi

      - name: Get VM Public IP
        id: getvmip
        run: |
          ip=$(az vm list-ip-addresses --resource-group "$RG_NAME" --name "$VM_NAME" \
                --query "[0].virtualMachine.network.publicIpAddresses[0].ipAddress" -o tsv)
          echo "vm_ip=$ip" >> $GITHUB_OUTPUT

      ############################################################
      # MANAGED IDENTITY + KV ACCESS
      ############################################################
      - name: Enable Managed Identity
        run: |
          az vm identity assign --resource-group "$RG_NAME" --name "$VM_NAME"

      - name: Allow VM to read Key Vault secret
        run: |
          PID=$(az vm show --resource-group "$RG_NAME" --name "$VM_NAME" \
                 --query identity.principalId -o tsv)
          az keyvault set-policy \
            --name "$KV_NAME" \
            --object-id "$PID" \
            --secret-permissions get

      ############################################################
      # PREPARE DEPLOYMENT FOLDER
      ############################################################
      - name: Prepare folder on VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ steps.getvmip.outputs.vm_ip }}
          username: vmadmin
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            sudo mkdir -p /opt/ntms-kv-blob-queue
            sudo chown vmadmin:vmadmin /opt/ntms-kv-blob-queue

      ############################################################
      # COPY SOURCE CODE
      ############################################################
      - name: Copy repo to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.getvmip.outputs.vm_ip }}
          username: vmadmin
          password: ${{ secrets.VM_PASSWORD }}
          source: "."
          target: "/opt/ntms-kv-blob-queue"

      ############################################################
      # CREATE setup.sh ON VM
      ############################################################
      - name: Create setup.sh on VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ steps.getvmip.outputs.vm_ip }}
          username: vmadmin
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            sudo tee /opt/ntms-kv-blob-queue/setup.sh > /dev/null << 'EOF'
            #!/bin/bash
            set -e
            cd /opt/ntms-kv-blob-queue

            sudo apt update -y
            sudo apt install -y python3 python3-pip python3-venv

            if [ ! -d "venv" ]; then
            python3 -m venv venv
            fi

            source venv/bin/activate

            pip install --upgrade pip
            pip install Flask azure-storage-blob azure-storage-queue Pillow azure-identity azure-keyvault-secrets

            mkdir -p templates logs

            pkill -f worker.py || true
            nohup python3 worker.py > logs/worker.log 2>&1 &

            pkill -f app.py || true
            nohup python3 app.py > logs/app.log 2>&1 &
            EOF

            sudo chmod +x /opt/ntms-kv-blob-queue/setup.sh

      ############################################################
      # RUN setup.sh
      ############################################################
      - name: Run setup.sh on VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ steps.getvmip.outputs.vm_ip }}
          username: vmadmin
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd /opt/ntms-kv-blob-queue
            export KEY_VAULT_URI="https://$KV_NAME.vault.azure.net/"
            ./setup.sh

      ############################################################
      # INSTALL SYSTEMD SERVICES FROM REPO
      ############################################################
      - name: Install systemd services from repo
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ steps.getvmip.outputs.vm_ip }}
          username: vmadmin
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            sudo cp /opt/ntms-kv-blob-queue/services/app.service /etc/systemd/system/app.service
            sudo cp /opt/ntms-kv-blob-queue/services/worker.service /etc/systemd/system/worker.service

            sudo chmod 644 /etc/systemd/system/app.service
            sudo chmod 644 /etc/systemd/system/worker.service

            sudo systemctl daemon-reload
            sudo systemctl enable app.service worker.service
            sudo systemctl restart app.service worker.service

      ############################################################
      # COMPLETED
      ############################################################
      - name: Completed
        run: |
          echo "Deployment complete!"
          echo "VM IP: ${{ steps.getvmip.outputs.vm_ip }}"
          echo "App URL: http://${{ steps.getvmip.outputs.vm_ip }}:3000"
