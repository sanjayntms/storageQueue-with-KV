name: Deploy StorageQueue + KV + VM (RBAC Enabled)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RG_NAME: ntms-kv-vm-rg
      LOCATION: centralindia
      KV_NAME: ntmsrhkv2
      VM_NAME: ntmsqueuevm
      ADMIN_USER: vmadmin
      ADMIN_PASS: ${{ secrets.VM_PASSWORD }}

      STORAGE_NAME: ntmsstorntms999
      QUEUE_NAME: image-processing-queue
      UPLOADED_CONTAINER: uploaded-images
      PROCESSED_CONTAINER: processed-images
      SECRET_NAME: AZURE-STORAGE-CONNECTION-STRING

    steps:

      ############################################################
      # CHECKOUT
      ############################################################
      - uses: actions/checkout@v4

      ############################################################
      # AZURE LOGIN
      ############################################################
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      ############################################################
      # RESOURCE GROUP
      ############################################################
      - run: az group create --name "$RG_NAME" --location "$LOCATION"

      ############################################################
      # KEY VAULT (RBAC MODE)
      ############################################################
      - name: Create Key Vault (RBAC Enabled)
        run: |
          if az keyvault show --name "$KV_NAME" >/dev/null 2>&1; then
            echo "Key Vault exists"
          else
            az keyvault create \
              --name "$KV_NAME" \
              --resource-group "$RG_NAME" \
              --location "$LOCATION" \
              --enable-rbac-authorization true
          fi

      ############################################################
      # STORAGE ACCOUNT
      ############################################################
      - name: Create Storage Account
        run: |
          if ! az storage account show --name "$STORAGE_NAME" >/dev/null 2>&1; then
            az storage account create \
              --name "$STORAGE_NAME" \
              --resource-group "$RG_NAME" \
              --location "$LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2
          fi

      - name: Enable Public Blob Access
        run: |
          az storage account update \
            --name "$STORAGE_NAME" \
            --resource-group "$RG_NAME" \
            --allow-blob-public-access true

      ############################################################
      # STORE SECRET IN KEY VAULT
      ############################################################
      - name: Save Connection String in KV
        run: |
          conn=$(az storage account show-connection-string \
            --name "$STORAGE_NAME" \
            --resource-group "$RG_NAME" -o tsv)

          az keyvault secret set \
            --vault-name "$KV_NAME" \
            --name "$SECRET_NAME" \
            --value "$conn"

      ############################################################
      # STORAGE OBJECTS
      ############################################################
      - name: Create Queue + Containers
        run: |
          az storage queue create --name "$QUEUE_NAME" --account-name "$STORAGE_NAME"
          az storage container create --name "$UPLOADED_CONTAINER" --account-name "$STORAGE_NAME"
          az storage container create --name "$PROCESSED_CONTAINER" --account-name "$STORAGE_NAME"

      ############################################################
      # NETWORK + VM
      ############################################################
      - name: Create VNet
        run: |
          az network vnet create \
            --resource-group "$RG_NAME" \
            --name ntms-vnet \
            --address-prefix 10.1.0.0/16 \
            --subnet-name default \
            --subnet-prefix 10.1.1.0/24

      - name: Create NSG + Rules
        run: |
          az network nsg create --resource-group "$RG_NAME" --name "${VM_NAME}-nsg"

          az network nsg rule create \
            --resource-group "$RG_NAME" \
            --nsg-name "${VM_NAME}-nsg" \
            --name allow-22 \
            --protocol Tcp \
            --priority 200 \
            --destination-port-ranges 22 \
            --access Allow \
            --direction Inbound

          az network nsg rule create \
            --resource-group "$RG_NAME" \
            --nsg-name "${VM_NAME}-nsg" \
            --name allow-3000 \
            --protocol Tcp \
            --priority 300 \
            --destination-port-ranges 3000 \
            --access Allow \
            --direction Inbound

      - name: Create Public IP + NIC
        run: |
          az network public-ip create \
            --resource-group "$RG_NAME" \
            --name "${VM_NAME}-ip" \
            --allocation-method Static

          az network nic create \
            --resource-group "$RG_NAME" \
            --name "${VM_NAME}-nic" \
            --vnet-name ntms-vnet \
            --subnet default \
            --network-security-group "${VM_NAME}-nsg" \
            --public-ip-address "${VM_NAME}-ip"

      - name: Create VM
        run: |
          az vm create \
            --resource-group "$RG_NAME" \
            --name "$VM_NAME" \
            --image Ubuntu2204 \
            --admin-username "$ADMIN_USER" \
            --admin-password "$ADMIN_PASS" \
            --size Standard_B1s \
            --nics "${VM_NAME}-nic"

      ############################################################
      # GET VM IP
      ############################################################
      - id: getvmip
        run: |
          ip=$(az vm list-ip-addresses \
            --resource-group "$RG_NAME" \
            --name "$VM_NAME" \
            --query "[0].virtualMachine.network.publicIpAddresses[0].ipAddress" -o tsv)

          echo "vm_ip=$ip" >> $GITHUB_OUTPUT

      ############################################################
      # MANAGED IDENTITY + RBAC
      ############################################################
      - name: Enable Managed Identity
        run: |
          az vm identity assign \
            --resource-group "$RG_NAME" \
            --name "$VM_NAME"

      - name: Assign RBAC Role (Key Vault Secrets User)
        run: |
          pid=$(az vm show \
            --resource-group "$RG_NAME" \
            --name "$VM_NAME" \
            --query identity.principalId -o tsv)

          kvId=$(az keyvault show \
            --name "$KV_NAME" \
            --query id -o tsv)

          # Avoid duplicate role assignment
          if ! az role assignment list \
            --assignee "$pid" \
            --scope "$kvId" \
            --query "[?roleDefinitionName=='Key Vault Secrets User']" \
            -o tsv | grep -q .; then

            az role assignment create \
              --assignee "$pid" \
              --role "Key Vault Secrets User" \
              --scope "$kvId"
          else
            echo "RBAC already assigned"
          fi

          echo "Waiting for RBAC propagation..."
          sleep 30

      ############################################################
      # DEPLOY APP
      ############################################################
      - name: Prepare VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ steps.getvmip.outputs.vm_ip }}
          username: vmadmin
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            sudo mkdir -p /opt/ntms-kv-blob-queue
            sudo chown vmadmin:vmadmin /opt/ntms-kv-blob-queue

      - name: Copy Code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.getvmip.outputs.vm_ip }}
          username: vmadmin
          password: ${{ secrets.VM_PASSWORD }}
          source: "."
          target: "/opt/ntms-kv-blob-queue"

      - name: Run setup.sh
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ steps.getvmip.outputs.vm_ip }}
          username: vmadmin
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd /opt/ntms-kv-blob-queue
            chmod +x setup.sh
            export KEY_VAULT_URI="https://$KV_NAME.vault.azure.net/"
            ./setup.sh

      ############################################################
      # SYSTEMD
      ############################################################
      - name: Start Services
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ steps.getvmip.outputs.vm_ip }}
          username: vmadmin
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            sudo cp /opt/ntms-kv-blob-queue/services/*.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable app worker
            sudo systemctl restart app worker

      ############################################################
      # DONE
      ############################################################
      - run: |
          echo "Deployment Completed"
          echo "App URL: http://${{ steps.getvmip.outputs.vm_ip }}:3000"
